[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcore-py"
version = "0.1.0"
description = "MCORE-1: Metrical Core Representation — language-agnostic prosodic data model, ternary weight algebra, and encoding system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jacob Walker", email = "jacob@symonic.com"},
]
keywords = ["prosody", "metrics", "computational-linguistics", "phonology", "sanskrit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
# Must stay sufficient to run the full test suite on its own: `pip install -e ".[dev]"`
# followed by `pytest` is the documented developer path, and CI relies on it for the
# Python version matrix. scipy backs the cochlear decoder in mcore_py.audio (optional at
# runtime, but exercised unguarded by tests/test_audio.py); PyYAML is read by
# tests/test_schema_factory.py. Both are left unpinned so the matrix can resolve versions
# appropriate to each interpreter.
dev = ["pytest>=7.0", "pytest-cov", "ruff", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]
mcp = [
    "fastmcp>=2.3",
    "appwrite>=6.1",
    "posthog>=3.7",
    "numpy>=1.24",
]
notebook = ["jupyter", "matplotlib"]
analysis = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "requests>=2.28",
]
all = ["mcore-py[dev,notebook,analysis,mcp]"]

[project.scripts]
mcore = "mcore_py.cli:main"
mcore-mcp = "mcore_mcp.server:main"

[project.urls]
Repository = "https://github.com/vortexpixelz/mcore1"
Documentation = "https://github.com/vortexpixelz/mcore1/blob/main/docs/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
