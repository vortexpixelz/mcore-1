<!DOCTYPE html>
<html lang="en">

<style>

body {
  background: #030510;

}

<body>
<canvas id="c"></canvas>

<div id="ui">
  <h2>Game Theory Geometry</h2>
  <select id="gameSelect">
    <option value="rps">Rock-Paper-Scissors</option>
    <option value="coordination">Coordination Game</option>
    <option value="stagHunt">Stag Hunt</option>
    <option value="hawkDove">Hawk-Dove-Retaliator</option>
    <option value="pd">Prisoner's Dilemma</option>
  </select>
  <div id="gameDesc"></div>
  <div class="section-label">Payoff Matrix A</div>
  <table class="matrix" id="matrixTable"></table>
  <div id="nashWrap"><b>&#9651;</b> Nash: <span id="nashDesc"></span></div>
  <button id="clearBtn">Clear Trajectories</button>
</div>

<div id="hoverInfo"></div>

<div id="legend">
  <span>High</span>
  <canvas id="legendCanvas" width="10" height="150"></canvas>
  <span>Low</span>
</div>

<div id="hint">click simplex · drag to orbit · scroll to zoom</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

// ─── Game Presets ─────────────────────────────────────────────────────────────
const GAMES = {
  rps: {
    name: 'Rock-Paper-Scissors',
    labels: ['Rock', 'Paper', 'Scissors'],
    A: [[0,-1,1],[1,0,-1],[-1,1,0]],
    nashPoints: [[1/3,1/3,1/3]],
    nashDesc: 'Interior (⅓,⅓,⅓) — neutral orbits',
    desc: 'Cyclic zero-sum game. The unique mixed Nash at the centroid is neutrally stable; replicator dynamics produces closed orbits.'
  },
  coordination: {
    name: 'Coordination Game',
    labels: ['Alpha','Beta','Gamma'],
    A: [[3,0,0],[0,3,0],[0,0,3]],
    nashPoints: [[1,0,0],[0,1,0],[0,0,1]],
    nashDesc: 'Three pure Nash at vertices',
    desc: 'Players gain by matching strategies. Three strict Nash equilibria at vertices divide the simplex into three basins of attraction.'
  },
  stagHunt: {
    name: 'Stag Hunt',
    labels: ['Stag','Hare','Alone'],
    A: [[5,0,0],[1,3,1],[0,0,2]],
    nashPoints: [[1,0,0],[0,1,0],[0,0,1]],
    nashDesc: 'Three pure Nash (Stag payoff-dominant)',
    desc: 'Coordination under uncertainty. Hunting Stag requires trust. Three equilibria with a separatrix: initial beliefs determine which is reached.'
  },
  hawkDove: {
    name: 'Hawk-Dove-Retaliator',
    labels: ['Hawk','Dove','Retaliator'],
    A: [[-1,4,-1],[0,2,2],[-1,4,2]],
    nashPoints: [[0,0,1],[2/3,1/3,0]],
    nashDesc: 'ESS at Retaliator; mixed H-D boundary Nash',
    desc: 'Retaliator (conditionally aggressive) is the ESS. Hawks and doves reach a mixed equilibrium on the boundary; Retaliator dominates the interior.'
  },
  pd: {
    name: "Prisoner's Dilemma",
    labels: ['Cooperate','Defect','Punish'],
    A: [[3,0,1],[5,1,2],[2,0,2]],
    nashPoints: [[0,1,0]],
    nashDesc: 'Pure Nash at Defect — dominance',
    desc: 'Defect strictly dominates Cooperate. Punish weakly resists defection but cannot overcome it. All trajectories converge to pure Defection.'
  }
};

// ─── Simplex Vertices (equilateral triangle, centroid at origin) ──────────────
const S = 1.15; // scale
const INV_S3 = 1 / Math.sqrt(3);
const V1 = new THREE.Vector3(0,           S * INV_S3,       0);
const V2 = new THREE.Vector3(-S * 0.5,    S * (-INV_S3/2),  0);
const V3 = new THREE.Vector3( S * 0.5,    S * (-INV_S3/2),  0);
// |V1-V2| = |V2-V3| = |V3-V1| = S ✓

function bary2cart(p1, p2, p3) {
  return new THREE.Vector3(
    p1*V1.x + p2*V2.x + p3*V3.x,
    p1*V1.y + p2*V2.y + p3*V3.y,
    0
  );
}

// Cramer's rule: solve [V2-V1, V3-V1] * [s,t]^T = point-V1
function cart2bary(point) {
  const ux = V2.x-V1.x, uy = V2.y-V1.y;
  const vx = V3.x-V1.x, vy = V3.y-V1.y;
  const wx = point.x-V1.x, wy = point.y-V1.y;
  const d = ux*vy - uy*vx;
  const s = (wx*vy - wy*vx) / d;
  const t = (ux*wy - uy*wx) / d;
  const r = 1 - s - t;
  if (r < -1e-4 || s < -1e-4 || t < -1e-4) return null;
  return [Math.max(0,r), Math.max(0,s), Math.max(0,t)];
}

// ─── Replicator Dynamics ──────────────────────────────────────────────────────
function matVec(A, p) {
  return [
    A[0][0]*p[0] + A[0][1]*p[1] + A[0][2]*p[2],
    A[1][0]*p[0] + A[1][1]*p[1] + A[1][2]*p[2],
    A[2][0]*p[0] + A[2][1]*p[1] + A[2][2]*p[2]
  ];
}

function payoff(p, A) {
  const Ap = matVec(A, p);
  return p[0]*Ap[0] + p[1]*Ap[1] + p[2]*Ap[2];
}

function replicatorVel(p, A) {
  const Ap = matVec(A, p);
  const mean = p[0]*Ap[0] + p[1]*Ap[1] + p[2]*Ap[2];
  return [p[0]*(Ap[0]-mean), p[1]*(Ap[1]-mean), p[2]*(Ap[2]-mean)];
}

function replicatorSpeed(p, A) {
  const dp = replicatorVel(p, A);
  return Math.sqrt(dp[0]*dp[0] + dp[1]*dp[1] + dp[2]*dp[2]);
}

// Barycentric velocity → 3D tangent (lies in simplex plane since Σdp_i = 0)
function baryVel2cart(dp) {
  return new THREE.Vector3(
    dp[0]*V1.x + dp[1]*V2.x + dp[2]*V3.x,
    dp[0]*V1.y + dp[1]*V2.y + dp[2]*V3.y,
    0
  );
}

function clampSimplex(p) {
  const q = [Math.max(0,p[0]), Math.max(0,p[1]), Math.max(0,p[2])];
  const s = q[0]+q[1]+q[2];
  return s < 1e-14 ? [1/3,1/3,1/3] : [q[0]/s, q[1]/s, q[2]/s];
}

function rk4(p, A, dt) {
  const k1 = replicatorVel(p, A);
  const p2 = clampSimplex([p[0]+dt/2*k1[0], p[1]+dt/2*k1[1], p[2]+dt/2*k1[2]]);
  const k2 = replicatorVel(p2, A);
  const p3 = clampSimplex([p[0]+dt/2*k2[0], p[1]+dt/2*k2[1], p[2]+dt/2*k2[2]]);
  const k3 = replicatorVel(p3, A);
  const p4 = clampSimplex([p[0]+dt*k3[0], p[1]+dt*k3[1], p[2]+dt*k3[2]]);
  const k4 = replicatorVel(p4, A);
  return clampSimplex([
    p[0] + dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]),
    p[1] + dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]),
    p[2] + dt/6*(k1[2]+2*k2[2]+2*k3[2]+k4[2])
  ]);
}

function integrate(p0, A, dt, nSteps) {
  const pts = [p0.slice()];
  let p = p0.slice();
  for (let i = 0; i < nSteps; i++) {
    p = rk4(p, A, dt);
    pts.push(p.slice());
  }
  return pts;
}

// ─── Color Map (deep purple → cyan → gold) ───────────────────────────────────
function payoffColor(u, uMin, uMax) {
  const t = uMax > uMin ? Math.max(0, Math.min(1, (u-uMin)/(uMax-uMin))) : 0.5;
  let r, g, b;
  if (t < 0.5) {
    const s = t * 2;
    r = 0.07 + 0.09*s;
    g = 0.03 + 0.73*s;
    b = 0.32 + 0.63*s;
  } else {
    const s = (t-0.5) * 2;
    r = 0.16 + 0.84*s;
    g = 0.76 - 0.40*s;
    b = 0.95 - 0.95*s;
  }
  return [r, g, b];
}

// Draw legend gradient
(function() {
  const canvas = document.getElementById('legendCanvas');
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 150);
  grad.addColorStop(0,    '#ffcc22');
  grad.addColorStop(0.5,  '#00d4ff');
  grad.addColorStop(1,    '#110028');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 10, 150);
})();

// ─── Three.js Scene ───────────────────────────────────────────────────────────
let scene, camera, renderer, controls;
let simplexMesh, baryGridGroup, edgeMesh, arrowGroup, nashGroup, labelGroup, starField;
let trajectories = [];
let currentGame = GAMES.rps;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030510);
  scene.fog = new THREE.FogExp2(0x020408, 0.18);

  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 40);
  camera.position.set(0.15, 0.25, 2.1);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 0.5;
  controls.maxDistance = 7;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0x101830, 3));
  const ptLight = new THREE.PointLight(0x3355ff, 5, 8);
  ptLight.position.set(0, 1.5, 1.2);
  scene.add(ptLight);

  starField = buildStars();
  scene.add(starField);

  buildScene(currentGame);
  bindEvents();
  animate();
}

// ─── Dispose helpers ──────────────────────────────────────────────────────────
function disposeObject(obj) {
  if (!obj) return;
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
      else child.material.dispose();
    }
  });
  scene.remove(obj);
}

function clearScene() {
  [simplexMesh, baryGridGroup, edgeMesh, arrowGroup, nashGroup, labelGroup].forEach(disposeObject);
  simplexMesh = baryGridGroup = edgeMesh = arrowGroup = nashGroup = labelGroup = null;
  clearTrajectories();
}

function clearTrajectories() {
  trajectories.forEach(t => disposeObject(t.mesh));
  trajectories = [];
}

// ─── Main Build ───────────────────────────────────────────────────────────────
function buildScene(game) {
  clearScene();
  currentGame = game;

  simplexMesh  = buildPayoffMesh(game);
  baryGridGroup = buildBaryGrid();
  edgeMesh     = buildEdges();
  arrowGroup   = buildArrows(game);
  nashGroup    = buildNashSpheres(game);
  labelGroup   = buildLabels(game);

  scene.add(simplexMesh, baryGridGroup, edgeMesh, arrowGroup, nashGroup, labelGroup);
  updateUI(game);
}

// ─── Stars ────────────────────────────────────────────────────────────────────
function buildStars() {
  const n = 900;
  const pos = new Float32Array(n*3);
  for (let i = 0; i < n*3; i++) pos[i] = (Math.random()-0.5)*22;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0x7799bb, size: 0.018, transparent: true, opacity: 0.55
  }));
}

// ─── Payoff Mesh ──────────────────────────────────────────────────────────────
function buildPayoffMesh(game) {
  const N = 64;
  const nVerts = (N+1)*(N+2)/2;
  const positions = new Float32Array(nVerts*3);
  const colors    = new Float32Array(nVerts*3);
  const Us        = new Float32Array(nVerts);
  const A         = game.A;

  // idx(i,j): row i has (N-i+1) points; cumulative offset = i*(N+1) - i*(i-1)/2
  function idx(i, j) { return i*(N+1) - ((i*(i-1))>>1) + j; }

  // Fill vertices
  let vi = 0;
  for (let i = 0; i <= N; i++) {
    for (let j = 0; j <= N-i; j++, vi++) {
      const p = [i/N, j/N, (N-i-j)/N];
      const cart = bary2cart(p[0], p[1], p[2]);
      positions[vi*3]   = cart.x;
      positions[vi*3+1] = cart.y;
      positions[vi*3+2] = cart.z;
      Us[vi] = payoff(p, A);
    }
  }

  let uMin = Infinity, uMax = -Infinity;
  for (let i = 0; i < nVerts; i++) {
    if (Us[i] < uMin) uMin = Us[i];
    if (Us[i] > uMax) uMax = Us[i];
  }

  for (let i = 0; i < nVerts; i++) {
    const c = payoffColor(Us[i], uMin, uMax);
    colors[i*3] = c[0]; colors[i*3+1] = c[1]; colors[i*3+2] = c[2];
  }

  // Build index buffer: two triangles per quad cell in barycentric grid
  const indexArr = [];
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N-i; j++) {
      // Lower triangle (always valid when i+j < N)
      indexArr.push(idx(i,j), idx(i+1,j), idx(i,j+1));
      // Upper triangle (valid when i+j < N-1, i.e., vertex idx(i+1,j+1) exists)
      if (j+1 < N-i) {
        indexArr.push(idx(i+1,j), idx(i+1,j+1), idx(i,j+1));
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors,    3));
  geo.setIndex(indexArr);
  geo.computeVertexNormals();

  return new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.92
  }));
}

// ─── Barycentric Grid ─────────────────────────────────────────────────────────
function buildBaryGrid() {
  const group = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color: 0x0d1e3d, transparent: true, opacity: 0.7 });
  const M = 9;
  for (let k = 1; k < M; k++) {
    const t = k/M;
    // iso-p1, iso-p2, iso-p3 lines
    const linePts = [
      [bary2cart(t, 0, 1-t), bary2cart(t, 1-t, 0)],
      [bary2cart(0, t, 1-t), bary2cart(1-t, t, 0)],
      [bary2cart(1-t, 0, t), bary2cart(0, 1-t, t)]
    ];
    linePts.forEach(pts => {
      pts.forEach(p => { p.z = 0.002; });
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      group.add(new THREE.Line(geo, mat));
    });
  }
  return group;
}

// ─── Outer Edges ──────────────────────────────────────────────────────────────
function buildEdges() {
  const pts = [V1, V2, V3, V1].map(v => new THREE.Vector3(v.x, v.y, 0.004));
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x2255aa }));
}

// ─── Flow Arrows ──────────────────────────────────────────────────────────────
function buildArrows(game) {
  const group = new THREE.Group();
  const M = 14;
  const A = game.A;

  for (let i = 1; i < M; i++) {
    for (let j = 1; j < M-i; j++) {
      const p = [i/M, j/M, 1-i/M-j/M];
      if (p[2] < 0.02) continue;

      const dp = replicatorVel(p, A);
      const speed = Math.sqrt(dp[0]*dp[0]+dp[1]*dp[1]+dp[2]*dp[2]);
      if (speed < 0.006) continue;

      const dir3d = baryVel2cart(dp);
      if (dir3d.length() < 1e-8) continue;
      dir3d.normalize();

      const len = Math.min(speed * 0.05, 0.065);
      const origin = bary2cart(p[0], p[1], p[2]);
      origin.z = 0.01;

      const hue = 0.4 - speed * 0.8; // green → warm
      const col = new THREE.Color().setHSL(Math.max(0.05, hue), 0.9, 0.55);
      const arrow = new THREE.ArrowHelper(dir3d, origin, len, col.getHex(), len*0.5, len*0.3);
      group.add(arrow);
    }
  }
  return group;
}

// ─── Nash Equilibrium Spheres ─────────────────────────────────────────────────
function buildNashSpheres(game) {
  const group = new THREE.Group();
  game.nashPoints.forEach((p, idx) => {
    const pos = bary2cart(p[0], p[1], p[2]);
    pos.z = 0.015;

    // Core sphere
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.024, 16, 16),
      new THREE.MeshPhongMaterial({
        color: 0xffd700, emissive: 0xff8800,
        emissiveIntensity: 1.4, shininess: 80
      })
    );
    sphere.position.copy(pos);
    sphere.userData.isCore = true;
    group.add(sphere);

    // Glow halo
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 12, 12),
      new THREE.MeshBasicMaterial({
        color: 0xffcc44, transparent: true, opacity: 0.10,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    halo.position.copy(pos);
    group.add(halo);

    // Outer ring (flat circle approximated by thin torus)
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.065, 0.004, 6, 32),
      new THREE.MeshBasicMaterial({
        color: 0xffaa00, transparent: true, opacity: 0.35,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    ring.position.copy(pos);
    ring.rotation.x = Math.PI/2;
    group.add(ring);
  });
  return group;
}

// ─── Vertex Labels ────────────────────────────────────────────────────────────
function makeSprite(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 80;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 26px Courier New';
  ctx.fillStyle = '#6699bb';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 160, 40);
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(0.46, 0.115, 1);
  return sprite;
}

function buildLabels(game) {
  const group = new THREE.Group();
  [[V1,0],[V2,1],[V3,2]].forEach(([v, i]) => {
    const s = makeSprite(game.labels[i]);
    s.position.set(v.x*1.20, v.y*1.20, 0.02);
    group.add(s);
  });
  return group;
}

// ─── Trajectories ─────────────────────────────────────────────────────────────
const TRAJ_COLORS = [0xff6622, 0xff22aa, 0x22ddff, 0xaaff44, 0xffdd00, 0xaa44ff];
let trajColorIdx = 0;

function launchTrajectory(p0bary) {
  const baryPts = integrate(p0bary, currentGame.A, 0.045, 280);
  const cartPts = baryPts.map(p => {
    const v = bary2cart(p[0], p[1], p[2]);
    v.z = 0.012;
    return v;
  });

  const color = TRAJ_COLORS[trajColorIdx % TRAJ_COLORS.length];
  trajColorIdx++;

  const traj = {
    allPts: cartPts,
    mesh: null,
    mat: new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.78,
      blending: THREE.AdditiveBlending, depthWrite: false
    }),
    startTime: Date.now(),
    duration: 3.2,
    lastN: 0
  };

  if (trajectories.length >= 7) {
    disposeObject(trajectories.shift().mesh);
  }
  trajectories.push(traj);
  growTrajectory(traj, 3);
  scene.add(traj.mesh);
}

function makeTubeGeo(cartPts) {
  // Deduplicate consecutive near-identical points to avoid CatmullRom NaN
  const deduped = [cartPts[0]];
  for (let i = 1; i < cartPts.length; i++) {
    if (cartPts[i].distanceTo(deduped[deduped.length-1]) > 2e-5) {
      deduped.push(cartPts[i]);
    }
  }
  if (deduped.length < 3) {
    // Return line geometry as fallback
    const g = new THREE.BufferGeometry();
    while (deduped.length < 2) deduped.push(deduped[0].clone());
    g.setFromPoints(deduped);
    return g;
  }
  const curve = new THREE.CatmullRomCurve3(deduped);
  const segs = Math.min(deduped.length * 2, 400);
  return new THREE.TubeGeometry(curve, segs, 0.0075, 5, false);
}

function growTrajectory(traj, nShow) {
  const pts = traj.allPts.slice(0, nShow);
  const geo = makeTubeGeo(pts);
  if (traj.mesh) {
    traj.mesh.geometry.dispose();
    traj.mesh.geometry = geo;
  } else {
    traj.mesh = new THREE.Mesh(geo, traj.mat);
  }
  traj.lastN = nShow;
}

// ─── Animation Loop ───────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const t = Date.now() / 1000;

  // Pulse Nash sphere cores
  if (nashGroup) {
    let coreIdx = 0;
    nashGroup.children.forEach(child => {
      if (child.userData.isCore) {
        const s = 1 + 0.22*Math.sin(t*2.6 + coreIdx*1.3);
        child.scale.setScalar(s);
        coreIdx++;
      }
    });
  }

  // Slowly rotate ring ornaments
  if (nashGroup) {
    nashGroup.children.forEach(child => {
      if (child.geometry && child.geometry.type === 'TorusGeometry') {
        child.rotation.z += 0.008;
      }
    });
  }

  // Grow trajectories
  trajectories.forEach(traj => {
    if (!traj.mesh) return;
    const elapsed = (Date.now()-traj.startTime)/1000;
    const frac = Math.min(elapsed/traj.duration, 1);
    const nShow = Math.max(3, Math.floor(frac*traj.allPts.length));
    if (nShow !== traj.lastN) growTrajectory(traj, nShow);
  });

  controls.update();
  renderer.render(scene, camera);
}

// ─── Event Handlers ───────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse2d   = new THREE.Vector2();
let downXY = {x:0, y:0};

function bindEvents() {
  document.getElementById('gameSelect').addEventListener('change', e => {
    buildScene(GAMES[e.target.value]);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    clearTrajectories();
    trajColorIdx = 0;
  });

  renderer.domElement.addEventListener('mousedown', e => {
    downXY = {x: e.clientX, y: e.clientY};
  });

  renderer.domElement.addEventListener('mouseup', e => {
    const dx = Math.abs(e.clientX-downXY.x);
    const dy = Math.abs(e.clientY-downXY.y);
    if (dx < 5 && dy < 5) handleClick(e);
  });

  renderer.domElement.addEventListener('mousemove', e => {
    mouse2d.x =  (e.clientX/innerWidth)*2 - 1;
    mouse2d.y = -(e.clientY/innerHeight)*2 + 1;
    raycaster.setFromCamera(mouse2d, camera);
    const hits = simplexMesh ? raycaster.intersectObject(simplexMesh) : [];
    if (hits.length) {
      const b = cart2bary(hits[0].point);
      if (b) { showHover(b); return; }
    }
    document.getElementById('hoverInfo').style.display = 'none';
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function handleClick(e) {
  mouse2d.x =  (e.clientX/innerWidth)*2 - 1;
  mouse2d.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(mouse2d, camera);
  const hits = simplexMesh ? raycaster.intersectObject(simplexMesh) : [];
  if (hits.length) {
    const b = cart2bary(hits[0].point);
    if (b) launchTrajectory(b);
  }
}

function showHover(b) {
  const A  = currentGame.A;
  const u  = payoff(b, A);
  const dp = replicatorVel(b, A);
  const spd = Math.sqrt(dp[0]**2+dp[1]**2+dp[2]**2);
  const panel = document.getElementById('hoverInfo');
  panel.style.display = 'block';
  panel.innerHTML =
    `<b>${currentGame.labels[0]}:</b> <span class="val">${(b[0]*100).toFixed(1)}%</span><br>`+
    `<b>${currentGame.labels[1]}:</b> <span class="val">${(b[1]*100).toFixed(1)}%</span><br>`+
    `<b>${currentGame.labels[2]}:</b> <span class="val">${(b[2]*100).toFixed(1)}%</span><br>`+
    `<b>Fitness U(p):</b> <span class="val">${u.toFixed(3)}</span><br>`+
    `<b>Evol. speed:</b>  <span class="val">${spd.toFixed(4)}</span>`;
}

// ─── UI ───────────────────────────────────────────────────────────────────────
function updateUI(game) {
  document.getElementById('gameDesc').textContent = game.desc;
  document.getElementById('nashDesc').textContent = game.nashDesc;

  const A = game.A;
  let html = '<thead><tr><th></th>'
    + game.labels.map(l => `<th>${l[0]}</th>`).join('') + '</tr></thead><tbody>';
  A.forEach((row, i) => {
    html += `<tr><th>${game.labels[i][0]}</th>`
      + row.map(v => {
          const fmt = (v % 1 === 0) ? v : v.toFixed(1);
          return `<td>${fmt}</td>`;
        }).join('')
      + '</tr>';
  });
  html += '</tbody>';
  document.getElementById('matrixTable').innerHTML = html;
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', init);
</script>
