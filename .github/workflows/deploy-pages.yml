name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "mcore_game_sim.html"
      - "game_theory_geometry.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          cp mcore_game_sim.html .pages/mcore_game_sim.html
          cp game_theory_geometry.html .pages/game_theory_geometry.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.pages
          publish_branch: gh-pages
