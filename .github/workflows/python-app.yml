name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync --extra dev --extra analysis --extra mcp

    - name: Lint with ruff
      run: uv run ruff check src tests

    - name: Test with pytest (deterministic)
      run: uv run pytest --tb=short -q
      env:
        PYTHONHASHSEED: "42"

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t mcore-py:ci .

    - name: Run tests inside Docker
      run: docker run --rm mcore-py:ci pytest --tb=short -q
