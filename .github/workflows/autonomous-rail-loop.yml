name: Autonomous rail loop

on:
  pull_request:
    branches: ["main"]
    paths:
      - "experimental/autonomous_rail_loop/**"
      - "tests/test_autonomous_loop.py"
      - "src/mcore_py/**"
      - ".github/workflows/autonomous-rail-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-loop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCORE-1
        run: python -m pip install -e .

      - name: Run five-turn bounded loop
        run: |
          python -m experimental.autonomous_rail_loop.runner \
            --max-loops 6 \
            --output-dir artifacts/autonomous-rail-loop

      - name: Upload redacted receipts
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-rail-loop-receipts
          path: artifacts/autonomous-rail-loop
          if-no-files-found: error
